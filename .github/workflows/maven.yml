name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test (JDK 11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Build, Test & Package Plugin
        run: mvn clean test process-resources hpi:hpi -B

      - name: Upload Plugin HPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdd-report-plugin
          path: |
            target/*.hpi
            target/*.jar
          if-no-files-found: error
          retention-days: 30
